# Provision the external MariaDB and DNS before running this configuration.
services:
  api:
    image: ${API_IMAGE:-apt-finder-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${API_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      API_PORT: 4000
    expose:
      - '4000'
    init: true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deployment environment}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
